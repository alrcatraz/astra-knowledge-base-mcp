# dir-kb-sync.py 配置文件（可选，不存在时等同当前：仅 .md/.txt 同步、OCR 全关）
# 加载优先级：--conf <path> > env KB_SYNC_CONF > 默认本目录 kb-sync.conf
# 配置文件缺失 / 字段缺失：一律取默认值，不报错。

# ── OCR 配置 ────────────────────────────────────────────────────────
# 对齐 MarkItDown MCP 的 OCR 模型（同一套 AI Gate × DeepSeek-OCR 约定）。
# MarkItDown 用环境变量：MARKITDOWN_OCR_MODEL=dmxapi-cn/DeepSeek-OCR、
#   MARKITDOWN_OCR_BASE_URL=http://127.0.0.1:20128/v1（AI Gate）。
# 这里用配置文件达到等效；默认关，启用才扫描图片。
ocr:
  enabled: false               # 默认 false（不启用 OCR）
  model: ""                    # 空 = 禁用；启用时任选其一（推荐）：
                               #   "dmxapi-cn/DeepSeek-OCR"（与 MarkItDown 完全一致）
                               #   "ocr"（AI Gate OCR combo，需其 vision 能力已声明）
                               #   "deepseek-ai/DeepSeek-OCR" / "siliconflow-cn/.../DeepSeek-OCR"
  base_url: ""                # 空 = 默认 AI Gate http://127.0.0.1:20128/v1
  api_key: ""                 # 空 = 回落到环境变量 ASTRA_LLM_API_KEY（再为空则走无鉴权）

# 图片扩展：仅当 ocr.enabled=true 且 ocr.model 非空时才纳入扫描。
image_exts: [".jpg", ".jpeg", ".png"]